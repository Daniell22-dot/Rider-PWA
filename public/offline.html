<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline - Ekshop Rider</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f4f4;
        color: #16191f;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      .card {
        background: #fff;
        border: 1px solid #d5d9d9;
        border-radius: 0.75rem;
        padding: 2rem 1.5rem;
        max-width: 22rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        font-size: 0.875rem;
        color: #6b7280;
        margin: 0 0 1.25rem;
      }
      button {
        background: #c89b3c;
        color: #16191f;
        font-weight: 600;
        border: none;
        border-radius: 9999px;
        padding: 0.75rem 1.5rem;
        font-size: 0.875rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>Reconnect to load your deliveries. This page will refresh automatically once you're back online.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
